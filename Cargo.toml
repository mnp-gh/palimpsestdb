[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
# std `File::try_lock`, used to keep a WAL open in one Node at a time.
rust-version = "1.89"
repository = "https://github.com/mnp-gh/palimpsestdb"

[workspace.dependencies]
psdb-storage = { path = "crates/psdb-storage" }
psdb-storage-memory = { path = "crates/psdb-storage-memory" }
psdb-core = { path = "crates/psdb-core" }
bson = "3.1"
serde_json = "1"
proptest = "1.12"
uuid = "1.28"
rustyline = "19"
getrandom = "0.4"
crc32c = "0.6"
syn = { version = "2.0", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Code quality: all of pedantic, minus lints that are noise here.
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Every Mutex lock can panic on poisoning; documenting each adds nothing.
missing_panics_doc = "allow"
# Performance lints from nursery (the perf group is already on by default;
# see nnethercote.github.io/perf-book). Not significant_drop_tightening: lock
# scopes here are correctness decisions.
needless_collect = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
large_stack_frames = "warn"
iter_with_drain = "warn"
set_contains_or_insert = "warn"
# Picked from restriction, which is not meant to be enabled whole.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
allow_attributes_without_reason = "warn"
# Seams for Clock, I/O and randomness: see clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"
# Closed sets are enums so `match` stays exhaustive: no `_` over variants.
match_wildcard_for_single_variants = "deny"
