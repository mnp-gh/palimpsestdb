[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
repository = "https://github.com/mnp-gh/palimpsestdb"

[workspace.dependencies]
psdb-storage = { path = "crates/psdb-storage" }
psdb-storage-memory = { path = "crates/psdb-storage-memory" }
psdb-core = { path = "crates/psdb-core" }
bson = "3.1"
serde_json = "1"
proptest = "1.12"
uuid = "1.28"
rustyline = "19"
getrandom = "0.4"
crc32c = "0.6"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
